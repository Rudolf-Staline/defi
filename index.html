<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Défi sportif aléatoire</title><style>
:root{--b:#2563eb;--b2:#1d4ed8;--t:#111827;--m:#6b7280;--l:#dbe3ef}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--t);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.w{max-width:680px;margin:auto;padding:28px 18px 44px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:25px}.k{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--b);text-transform:uppercase}h1{font-size:clamp(32px,8vw,54px);line-height:.95;letter-spacing:-.045em;margin:8px 0 0}.ico{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--b);color:#fff;font-size:28px}.card{min-height:360px;border-radius:28px;padding:24px;color:#fff;background:linear-gradient(145deg,var(--b),var(--b2));box-shadow:0 18px 45px rgba(37,99,235,.18);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.card:after{content:"";position:absolute;width:210px;height:210px;border:1px solid rgba(255,255,255,.20);border-radius:50%;right:-90px;top:-90px}.label{font-size:12px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:#bfdbfe;position:relative;z-index:1}.ct{font-size:clamp(34px,8vw,52px);line-height:.98;letter-spacing:-.045em;margin:10px 0 28px;position:relative;z-index:1}.explain{position:relative;z-index:1;border-top:1px solid rgba(255,255,255,.25);padding-top:18px}.explain strong{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#bfdbfe;margin-bottom:7px}.explain p{margin:0;font-size:16px;line-height:1.5;color:#f8fbff}.empty{color:#dbeafe;font-size:17px;line-height:1.5;margin-top:18px;position:relative;z-index:1}.primary{width:100%;margin-top:16px;border:0;border-radius:19px;background:var(--b);color:#fff;font-weight:1000;font-size:19px;padding:20px 18px;cursor:pointer;box-shadow:0 10px 35px rgba(37,99,235,.18)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.secondary{border:1px solid var(--l);background:#fff;color:var(--t);padding:14px;border-radius:15px;font-weight:800}.secondary:disabled{opacity:.35}.st{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--m);margin:28px 2px 12px;font-weight:900}.hist{display:grid;gap:8px}.h{padding:13px 15px;border:1px solid var(--l);background:#fff;border-radius:14px;font-size:14px;font-weight:800}.foot{margin-top:24px;color:#94a3b8;font-size:12px;text-align:center}.flash{animation:f .28s ease}@keyframes f{0%{transform:scale(.97);opacity:.55}100%{transform:scale(1);opacity:1}}
</style></head><body><main class="w"><div class="top"><div><div class="k">La Quête des Sceaux · Sceau jaune</div><h1>Défi sportif<br>aléatoire</h1></div><div class="ico">⚡</div></div><section class="card" id="card"><div id="content"><div class="label">100 défis simples</div><div class="empty">Appuie sur le bouton pour tirer un défi pour toute l’équipe.</div></div></section><button class="primary" id="draw">TIRER UN DÉFI</button><div class="actions"><button class="secondary" id="replay" disabled>Revoir le défi</button><button class="secondary" id="clear">Effacer l’historique</button></div><div class="st">5 derniers tirages</div><div class="hist" id="history"><div style="color:var(--m);font-size:14px">Aucun tirage pour l’instant.</div></div><div class="foot">Débutants · sans matériel · sans contact avec le sol</div></main><script>
const C=[["Toute l’équipe fait 10 squats","Debout, pieds écartés à peu près comme les épaules. Descendez comme pour vous asseoir sur une chaise, puis remontez. Chaque joueur en fait 10."],["Toute l’équipe fait 15 squats","Même mouvement : descendez les fesses vers l’arrière puis remontez. Chaque joueur en fait 15."],["Toute l’équipe fait 20 squats","Chaque joueur fait 20 squats à son rythme."],["50 squats pour l’équipe","L’équipe doit atteindre 50 squats au total. Répartissez-les comme vous voulez."],["75 squats pour l’équipe","Additionnez les squats de tous les joueurs jusqu’à atteindre 75."],["100 squats pour l’équipe","L’équipe doit faire 100 squats au total. Tout le monde participe."],["10 squats tous ensemble","Les 5 joueurs font 10 squats en même temps."],["15 squats tous ensemble","Faites 15 squats ensemble en descendant et remontant au même moment."],["20 squats tous ensemble","Toute l’équipe fait 20 squats au même rythme."],["30 squats sans longue pause","L’équipe enchaîne 30 squats au total sans longue pause entre les joueurs."],["20 petits sauts sur place","Chaque joueur fait 20 petits sauts sur place, pieds joints ou légèrement écartés."],["30 petits sauts sur place","Toute l’équipe fait 30 petits sauts sur place."],["50 sauts pour l’équipe","Additionnez 50 petits sauts entre les 5 joueurs."],["100 sauts pour l’équipe","L’équipe doit atteindre 100 petits sauts au total."],["10 sauts tous ensemble","Les 5 joueurs font 10 petits sauts en même temps."],["20 sauts tous ensemble","Toute l’équipe fait 20 petits sauts au même rythme."],["Sauts pendant 20 secondes","Tout le monde saute doucement sur place pendant 20 secondes."],["Sauts pendant 30 secondes","Toute l’équipe saute sur place pendant 30 secondes."],["5 grands sauts chacun","Chaque joueur fait 5 sauts un peu plus hauts, sans avancer."],["Saut puis statue","Faites 10 petits sauts puis restez complètement immobiles pendant 5 secondes."],["20 montées de genoux","Chaque joueur lève alternativement un genou puis l’autre, 20 fois au total."],["30 montées de genoux","Chaque joueur fait 30 montées de genoux sur place."],["50 montées de genoux pour l’équipe","L’équipe doit atteindre 50 montées de genoux au total."],["100 montées de genoux pour l’équipe","Additionnez les répétitions de tous les joueurs jusqu’à 100."],["20 secondes de montées de genoux","Tout le monde monte les genoux sur place pendant 20 secondes."],["30 secondes de montées de genoux","L’équipe fait des montées de genoux pendant 30 secondes."],["10 montées de genoux ensemble","Les 5 joueurs font 10 répétitions ensemble."],["20 montées de genoux ensemble","Toute l’équipe fait 20 répétitions en essayant de rester au même rythme."],["Montées de genoux chacun son tour","Chaque joueur fait 10 répétitions puis passe au suivant."],["Montées de genoux lentes","Chaque joueur fait 10 répétitions lentement en levant bien le genou."],["20 talons-fesses","Chaque joueur ramène alternativement les talons vers les fesses, 20 fois."],["30 talons-fesses","Chaque joueur fait 30 répétitions sur place."],["50 talons-fesses pour l’équipe","L’équipe doit atteindre 50 répétitions au total."],["100 talons-fesses pour l’équipe","Additionnez les répétitions jusqu’à 100."],["20 secondes de talons-fesses","Toute l’équipe fait des talons-fesses pendant 20 secondes."],["30 secondes de talons-fesses","Continuez le mouvement pendant 30 secondes."],["10 talons-fesses ensemble","Les 5 joueurs font 10 répétitions au même rythme."],["20 talons-fesses ensemble","Toute l’équipe fait 20 répétitions ensemble."],["Talons-fesses chacun son tour","Chaque joueur fait 10 répétitions puis laisse la place au suivant."],["Talons-fesses lents","Chaque joueur fait 10 répétitions lentement."],["Chaise contre le mur 10 secondes","Dos contre un mur, descendez comme si vous étiez assis sur une chaise invisible et tenez 10 secondes."],["Chaise contre le mur 15 secondes","Chaque joueur tient 15 secondes, dos contre le mur et genoux pliés."],["Chaise contre le mur 20 secondes","Chaque joueur tient 20 secondes contre le mur."],["Chaise contre le mur 30 secondes","Chaque joueur essaie de tenir 30 secondes contre le mur."],["1 minute de chaise pour l’équipe","Additionnez le temps de tous les joueurs jusqu’à atteindre 1 minute."],["2 minutes de chaise pour l’équipe","Les joueurs se relaient contre le mur jusqu’à cumuler 2 minutes."],["Chaise chacun son tour","Chaque joueur tient 15 secondes contre le mur."],["Chaise par deux","Deux joueurs tiennent 15 secondes, puis les suivants."],["Chaise avec les bras devant","Tenez 15 secondes contre le mur avec les bras tendus devant vous."],["Chaise tous ensemble","Si vous avez assez de mur, toute l’équipe tient 15 secondes en même temps."],["Bras en l’air 15 secondes","Levez les deux bras au-dessus de la tête et gardez-les tendus pendant 15 secondes."],["Bras en l’air 20 secondes","Toute l’équipe garde les bras au-dessus de la tête pendant 20 secondes."],["Bras en l’air 30 secondes","Chaque joueur tient les bras en l’air pendant 30 secondes."],["Bras devant 15 secondes","Tendez les deux bras devant vous à hauteur des épaules pendant 15 secondes."],["Bras devant 20 secondes","Toute l’équipe garde les bras tendus devant pendant 20 secondes."],["Bras devant 30 secondes","Chaque joueur garde les bras tendus devant pendant 30 secondes."],["Bras sur les côtés 15 secondes","Tendez les bras à gauche et à droite à hauteur des épaules pendant 15 secondes."],["Bras sur les côtés 20 secondes","Toute l’équipe garde les bras tendus sur les côtés pendant 20 secondes."],["Bras sur les côtés 30 secondes","Chaque joueur tient les bras sur les côtés pendant 30 secondes."],["Lever les bras 20 fois","Bras le long du corps, levez-les au-dessus de la tête puis redescendez. Faites 20 répétitions."],["10 pas à droite, 10 à gauche","Faites 10 petits pas latéraux vers la droite puis 10 vers la gauche, sans courir."],["20 pas latéraux","Chaque joueur fait 20 petits pas de côté en alternant droite et gauche."],["30 pas latéraux","Toute l’équipe fait 30 petits pas latéraux sur place."],["Pas latéraux pendant 20 secondes","Déplacez-vous doucement d’un côté puis de l’autre pendant 20 secondes."],["Pas latéraux pendant 30 secondes","Continuez les petits pas de côté pendant 30 secondes."],["10 pas latéraux ensemble","Les 5 joueurs font 10 pas de côté au même rythme."],["20 pas latéraux ensemble","Toute l’équipe fait 20 pas latéraux ensemble."],["Pas droite-gauche pendant 15 secondes","Faites un pas à droite, revenez au centre, puis un pas à gauche. Continuez 15 secondes."],["Pas droite-gauche pendant 20 secondes","Même mouvement pendant 20 secondes."],["Pas droite-gauche pendant 30 secondes","Même mouvement pendant 30 secondes, tranquillement."],["Toucher les épaules 20 fois","Debout, touchez l’épaule gauche avec la main droite puis l’épaule droite avec la main gauche. Faites 20 touches."],["Toucher les épaules 30 fois","Chaque joueur alterne les mains pour toucher les épaules 30 fois."],["50 touches d’épaules pour l’équipe","L’équipe doit atteindre 50 touches d’épaules au total."],["100 touches d’épaules pour l’équipe","Additionnez les touches de tous les joueurs jusqu’à 100."],["10 touches d’épaules ensemble","Les 5 joueurs font 10 touches d’épaules en même temps."],["20 touches d’épaules ensemble","Toute l’équipe fait 20 touches au même rythme."],["Épaules pendant 20 secondes","Touchez alternativement vos épaules pendant 20 secondes."],["Épaules pendant 30 secondes","Toute l’équipe continue le mouvement pendant 30 secondes."],["Épaules lentement","Chaque joueur fait 10 touches lentement."],["Épaules chacun son tour","Chaque joueur fait 10 touches puis passe au suivant."],["Tenir sur un pied 10 secondes","Chaque joueur lève un pied et essaie de rester en équilibre pendant 10 secondes."],["Tenir sur un pied 15 secondes","Chaque joueur reste en équilibre sur un pied pendant 15 secondes."],["Tenir sur un pied 20 secondes","Chaque joueur essaie de tenir 20 secondes sans poser l’autre pied."],["Équilibre pied droit","Tous les joueurs tiennent 10 secondes sur le pied droit."],["Équilibre pied gauche","Tous les joueurs tiennent 10 secondes sur le pied gauche."],["Équilibre 10 secondes par pied","Chaque joueur tient 10 secondes sur le pied droit puis 10 secondes sur le pied gauche."],["Équilibre tous ensemble","Toute l’équipe tient sur un pied pendant 10 secondes en même temps."],["Équilibre avec les bras ouverts","Tenez sur un pied pendant 15 secondes avec les bras écartés."],["Équilibre mains sur les hanches","Tenez sur un pied pendant 10 secondes avec les mains sur les hanches."],["Équilibre facile","Chaque joueur tient simplement 5 secondes sur chaque pied."],["10 squats + 10 sauts","Chaque joueur fait 10 squats puis 10 petits sauts sur place."],["10 squats + 20 montées de genoux","Chaque joueur fait 10 squats puis 20 montées de genoux."],["10 squats + 20 talons-fesses","Chaque joueur fait 10 squats puis 20 talons-fesses."],["10 squats + bras en l’air 15 secondes","Chaque joueur fait 10 squats puis garde les bras en l’air pendant 15 secondes."],["10 sauts + 10 montées de genoux","Chaque joueur fait 10 petits sauts puis 10 montées de genoux."],["10 sauts + 10 talons-fesses","Chaque joueur fait 10 petits sauts puis 10 talons-fesses."],["20 montées de genoux + 20 talons-fesses","Chaque joueur fait 20 montées de genoux puis 20 talons-fesses."],["10 squats + équilibre 10 secondes","Chaque joueur fait 10 squats puis tient 10 secondes sur un pied."],["15 squats + bras sur les côtés","Chaque joueur fait 15 squats puis garde les bras sur les côtés pendant 15 secondes."],["Défi final facile","Chaque joueur fait 10 squats, 10 petits sauts, 10 montées de genoux et tient 10 secondes sur un pied."]];let last=null,current=null,H=[];const content=document.getElementById("content"),card=document.getElementById("card"),hist=document.getElementById("history"),replay=document.getElementById("replay");
function show(c){content.innerHTML='<div class="label">Défi</div><div class="ct">'+c[0]+'</div><div class="explain"><strong>Comment faire</strong><p>'+c[1]+'</p></div>';card.classList.remove("flash");void card.offsetWidth;card.classList.add("flash")}
function rh(){hist.innerHTML=H.length?H.slice(0,5).map(i=>'<div class="h">'+C[i][0]+'</div>').join(""):'<div style="color:var(--m);font-size:14px">Aucun tirage pour l’instant.</div>'}
function draw(){let i;do{i=Math.floor(Math.random()*C.length)}while(C.length>1&&i===last);current=last=i;H.unshift(i);H=H.slice(0,5);show(C[i]);rh();replay.disabled=false;if(navigator.vibrate)navigator.vibrate(25)}
document.getElementById("draw").onclick=draw;replay.onclick=()=>current!==null&&show(C[current]);document.getElementById("clear").onclick=()=>{H=[];rh()};
</script></body></html>

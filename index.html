<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Défi sportif aléatoire</title><style>
:root{--b:#2563eb;--b2:#1d4ed8;--t:#111827;--m:#6b7280;--l:#dbe3ef}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 8%,rgba(37,99,235,.08),transparent 26rem),linear-gradient(#fff,#f8fafc 72%,#fff);color:var(--t);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.w{max-width:680px;margin:auto;padding:28px 18px 44px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:25px}.k{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--b);text-transform:uppercase}h1{font-size:clamp(32px,8vw,54px);line-height:.95;letter-spacing:-.045em;margin:8px 0 0}.ico{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--b);color:white;font-size:28px;box-shadow:0 0 36px rgba(37,99,235,.2)}.card{min-height:330px;border-radius:28px;padding:22px;color:#fff;background:linear-gradient(145deg,var(--b),var(--b2));box-shadow:0 18px 45px rgba(37,99,235,.18);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}.card:after{content:"";position:absolute;width:190px;height:190px;border:1px solid rgba(255,255,255,.24);border-radius:50%;right:-75px;top:-75px}.meta{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}.p{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);font-size:12px;font-weight:800}.ct{font-size:clamp(34px,8vw,50px);line-height:.98;letter-spacing:-.045em;margin:24px 0 14px;position:relative;z-index:1}.r{font-size:16px;line-height:1.5;color:#eef4ff;position:relative;z-index:1}.empty{color:#dbeafe;font-size:17px;line-height:1.5;margin-top:20px}.primary{width:100%;margin-top:16px;border:0;border-radius:19px;background:var(--b);color:#fff;font-weight:1000;font-size:19px;padding:20px 18px;cursor:pointer;box-shadow:0 10px 35px rgba(37,99,235,.20)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.secondary{border:1px solid var(--l);background:#fff;color:var(--t);padding:14px;border-radius:15px;font-weight:800}.secondary:disabled{opacity:.35}.st{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--m);margin:28px 2px 12px;font-weight:900}.hist{display:grid;gap:8px}.h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border:1px solid var(--l);background:#fff;border-radius:14px}.h strong{font-size:14px}.h span{font-size:11px;color:var(--b);font-weight:800;text-transform:uppercase}.foot{margin-top:24px;color:#94a3b8;font-size:12px;text-align:center}.flash{animation:f .28s ease}@keyframes f{0%{transform:scale(.97);opacity:.55}100%{transform:scale(1);opacity:1}}
</style></head><body><main class="w"><div class="top"><div><div class="k">La Quête des Sceaux · Sceau jaune</div><h1>Défi sportif<br>aléatoire</h1></div><div class="ico">⚡</div></div><section class="card" id="card"><div id="content"><div class="k" style="color:#fff">100 défis disponibles</div><div class="empty">Appuie sur le bouton. Le même défi ne sort jamais deux fois d’affilée.</div></div></section><button class="primary" id="draw">TIRER UN DÉFI</button><div class="actions"><button class="secondary" id="replay" disabled>Rejouer</button><button class="secondary" id="clear">Effacer l’historique</button></div><div class="st">5 derniers tirages</div><div class="hist" id="history"><div style="color:var(--m)">Aucun tirage pour l’instant.</div></div><div class="foot">Sans matériel · petit espace · défis courts</div></main><script>
const C=[["Endurance","Chaise contre un mur","60–120 s","1 joueur","Tenir la position chaise le plus longtemps possible."],["Endurance","Planche classique","45–120 s","1 joueur","Tenir la planche sans poser les genoux."],["Endurance","Planche haute","45–120 s","1 joueur","Tenir en position haute de pompe, bras tendus."],["Endurance","Squat statique","30–90 s","1 joueur","Tenir un squat à mi-hauteur sans mur."],["Endurance","Bras en croix","60–120 s","1 joueur","Garder les bras tendus à l’horizontale."],["Endurance","Petits cercles","45–90 s","1 joueur","Bras tendus, faire de petits cercles continus."],["Endurance","Mountain climbers","30 s","1 joueur","Faire le maximum de mountain climbers propres."],["Endurance","Burpees express","30 s","1 joueur","Faire le maximum de burpees propres."],["Endurance","Squats chrono","45 s","1 joueur","Faire le maximum de squats complets."],["Endurance","Pompes chrono","45 s","1 joueur","Faire le maximum de pompes propres."],["Endurance","Genoux hauts","45 s","1 joueur","Faire des montées de genoux sans interruption."],["Endurance","Jumping jacks","45 s","1 joueur","Maximum de jumping jacks réguliers."],["Endurance","Talons-fesses","45 s","1 joueur","Maximum de talons-fesses en rythme."],["Endurance","Demi-squat pulsé","45 s","1 joueur","Rester en demi-squat et faire de petites pulsations."],["Endurance","Planche épaules","45 s","1 joueur","En planche haute, toucher alternativement chaque épaule."],["Équilibre","Flamant rose","60 s","1 joueur","Tenir sur un pied ; fermer les yeux après 20 secondes."],["Équilibre","Flamant mains en l’air","60 s","1 joueur","Tenir sur un pied avec les bras levés."],["Équilibre","Pied croisé","45 s","1 joueur","Tenir sur un pied avec l’autre jambe croisée."],["Équilibre","Yeux fermés","45 s","1 joueur","Tenir sur un pied, yeux fermés."],["Équilibre","Mini-squats sur un pied","30 s","1 joueur","Faire le plus de mini-squats possibles sur un pied."],["Équilibre","Rotation lente","45 s","1 joueur","Sur un pied, tourner lentement le haut du corps."],["Équilibre","Bras opposés","45 s","1 joueur","Sur un pied, garder les bras dans des directions opposées."],["Équilibre","Genou haut","45 s","1 joueur","Tenir un genou levé à hauteur de hanche."],["Équilibre","Pointe des pieds","45 s","1 joueur","Tenir sur la pointe des pieds."],["Équilibre","Pointe + yeux fermés","30 s","1 joueur","Tenir sur la pointe des pieds, yeux fermés."],["Coordination","Jacques a dit sportif","60–90 s","2–5 joueurs","Suivre les ordres rapides du gardien sans erreur."],["Coordination","Miroir","60 s","2 joueurs","Copier instantanément les mouvements de l’adversaire."],["Coordination","Séquence 4 mouvements","60 s","1–5 joueurs","Mémoriser puis reproduire 4 gestes."],["Coordination","Séquence évolutive","2 min","1–5 joueurs","Un mouvement est ajouté à chaque tour."],["Coordination","Main-genou opposé","45 s","1 joueur","Toucher main droite-genou gauche puis inversement."],["Coordination","Tête-épaules-genoux","45 s","2 joueurs","Suivre les commandes sans se tromper."],["Coordination","Clap inversé","60 s","2 joueurs","À gauche, taper à droite ; à droite, taper à gauche."],["Coordination","Rythme imposé","60 s","1–5 joueurs","Reproduire une suite de claps et gestes."],["Coordination","Squat + clap","45 s","1 joueur","Alterner squat et différents claps sans erreur."],["Coordination","Croisé rapide","45 s","1 joueur","Toucher alternativement épaule et main opposées."],["Coordination","Pas latéraux sur place","45 s","1 joueur","Suivre droite-gauche au rythme du gardien."],["Coordination","Code moteur","60 s","1–5 joueurs","Chaque chiffre correspond à un geste."],["Coordination","Main-pied","45 s","1 joueur","Toucher pied droit-main gauche puis inversement."],["Coordination","Double tempo","60 s","1 joueur","Squat sur un clap, saut sur deux claps."],["Coordination","Statue instantanée","60 s","1–5 joueurs","S’immobiliser immédiatement au signal."],["Réflexes","Tête-épaules-genoux-sol","BO5","2 joueurs","Premier à toucher le sol au bon signal gagne."],["Réflexes","Clap réflexe","BO7","2 joueurs","Premier à taper dans ses mains au signal marque."],["Réflexes","Debout-assis","BO5","2 joueurs","Suivre les ordres debout/accroupi sans erreur."],["Réflexes","Gauche-droite","BO7","2 joueurs","Pointer le côté opposé à celui annoncé."],["Réflexes","Sol-ciel","BO7","2 joueurs","Toucher le sol ou lever les mains selon l’ordre."],["Réflexes","Vrai-faux moteur","60 s","2 joueurs","Vrai = squat ; faux = mains en l’air."],["Réflexes","Numéro surprise","60 s","2–5 joueurs","Réagir au geste associé à chaque nombre."],["Réflexes","Freeze","60 s","1–5 joueurs","S’arrêter net au clap."],["Réflexes","Imitation éclair","60 s","2 joueurs","Premier à reproduire le geste du gardien marque."],["Réflexes","Main sur tête","BO5","2 joueurs","Premier à toucher sa tête au bon ordre gagne."],["Synchronisation","20 squats synchro","60–90 s","3–5 joueurs","Réaliser 20 squats parfaitement synchronisés."],["Synchronisation","30 jumping jacks synchro","60–90 s","3–5 joueurs","Rester exactement au même rythme."],["Synchronisation","Planche collective","60 s","3–5 joueurs","Tous tiennent la planche ; un abandon arrête le chrono."],["Synchronisation","Lever de genoux synchro","45 s","3–5 joueurs","Monter les genoux au même rythme."],["Synchronisation","Clap collectif","60 s","3–5 joueurs","Reproduire ensemble une séquence de claps."],["Synchronisation","Squat-stop","60 s","3–5 joueurs","Faire des squats ensemble et s’arrêter au signal."],["Synchronisation","Mouvement en chaîne","90 s","5 joueurs","Chaque joueur ajoute un geste à reproduire."],["Synchronisation","Demi-tour synchro","60 s","3–5 joueurs","Faire le même demi-tour exactement ensemble."],["Synchronisation","Statue d’équipe","60 s","3–5 joueurs","Former une posture annoncée sans parler."],["Synchronisation","Tempo variable","60 s","3–5 joueurs","Suivre un rythme lent/rapide imposé."],["Duel","Planche duel","60–120 s","2 joueurs","Dernier en planche gagne."],["Duel","Chaise duel","60–120 s","2 joueurs","Dernier en chaise gagne."],["Duel","Squat duel","45 s","2 joueurs","Le plus de squats propres gagne."],["Duel","Burpee duel","30 s","2 joueurs","Le plus de burpees propres gagne."],["Duel","Pompes duel","45 s","2 joueurs","Le plus de pompes propres gagne."],["Duel","Équilibre duel","60 s","2 joueurs","Dernier sur un pied gagne."],["Duel","Miroir duel","60 s","2 joueurs","Copier le leader sans erreur."],["Duel","Mémoire duel","90 s","2 joueurs","Premier à reproduire une séquence de 5 gestes gagne."],["Duel","Réaction duel","BO5","2 joueurs","Toucher genoux puis tête au signal."],["Duel","Code duel","60 s","2 joueurs","Premier à 3 erreurs sur le code moteur perd."],["Collectif","100 répétitions","90 s","5 joueurs","Atteindre 100 répétitions en combinant 3 mouvements."],["Collectif","Relais sans déplacement","90 s","5 joueurs","10 squats chacun puis passage au suivant."],["Collectif","50 squats partagés","60 s","5 joueurs","Répartir librement 50 squats entre les membres."],["Collectif","Planche tournante","2 min","5 joueurs","20 secondes de planche chacun à la suite."],["Collectif","Défi silencieux","90 s","5 joueurs","Réaliser 5 gestes ensemble sans parler."],["Collectif","Capitaine","90 s","5 joueurs","Suivre les 5 gestes inventés par le capitaine."],["Collectif","Chaîne de squats","60 s","5 joueurs","Faire 1,2,3,4,5 squats puis revenir à 1."],["Collectif","Compte interdit","90 s","5 joueurs","Compter jusqu’à 20 sans ordre ; deux voix simultanées = retour à 1."],["Collectif","Minute parfaite","60 s","5 joueurs","Alterner squat et clap sans casser la synchronisation."],["Collectif","Tous différents","90 s","5 joueurs","Chacun tient un mouvement différent pendant 30 s."],["Mixte","Squat mémoire","90 s","1 joueur","10 squats puis reproduire 4 gestes mémorisés."],["Mixte","Planche + questions","60 s","1 joueur","Tenir la planche et répondre à 5 questions."],["Mixte","Chaise + calcul mental","60 s","1 joueur","Tenir la chaise et réussir 3 calculs sur 5."],["Mixte","Burpees + mémoire","60 s","1 joueur","5 burpees puis répéter 5 mots dans l’ordre."],["Mixte","Équilibre + alphabet","60 s","1 joueur","Sur un pied, réciter Z jusqu’à P."],["Mixte","Squat + couleurs","60 s","1 joueur","Associer chaque couleur annoncée à un geste."],["Mixte","Planche + code","60 s","1 joueur","Lever la bonne main selon le chiffre annoncé."],["Mixte","Genoux hauts + vrai/faux","60 s","1 joueur","Continuer les genoux hauts en répondant vrai/faux."],["Mixte","Jumping jacks + mémoire","60 s","1 joueur","20 jumping jacks puis réciter 6 chiffres."],["Mixte","Squat + réaction","60 s","1 joueur","Faire des squats ; au clap, toucher le sol."],["Mixte","Pompes + compte","60 s","1 joueur","Faire 10 pompes en comptant à rebours."],["Mixte","Chaise + jours inversés","60 s","1 joueur","Tenir la chaise et réciter les jours à l’envers."],["Mixte","Équilibre + questions","60 s","1 joueur","Sur un pied, répondre à 5 questions."],["Mixte","Planche + alphabet","60 s","1 joueur","Tenir la planche en récitant une lettre sur deux."],["Mixte","Squat + nombres impairs","60 s","1 joueur","15 squats en annonçant les nombres impairs."],["Mixte","Mouvement interdit","60 s","2–5 joueurs","Ne jamais reproduire le mouvement interdit."],["Mixte","Chef caché","90 s","5 joueurs","Identifier le joueur qui change les gestes."],["Mixte","Copie retardée","60 s","2 joueurs","Copier chaque geste avec exactement un geste de retard."],["Mixte","Stop précision","60 s","1–5 joueurs","S’arrêter exactement à mi-squat au signal."],["Mixte","Dernier mouvement","90 s","2–5 joueurs","Refaire uniquement le dernier geste montré."]];let last=null,current=null,H=[];const content=document.getElementById("content"),card=document.getElementById("card"),hist=document.getElementById("history"),replay=document.getElementById("replay");
function show(c){content.innerHTML='<div class="meta"><span class="p">'+c[0]+'</span><span class="p">'+c[2]+'</span><span class="p">'+c[3]+'</span></div><div><div class="ct">'+c[1]+'</div><div class="r">'+c[4]+'</div></div>';card.classList.remove("flash");void card.offsetWidth;card.classList.add("flash")}
function rh(){hist.innerHTML=H.length?H.slice(0,5).map(i=>'<div class="h"><strong>'+C[i][1]+'</strong><span>'+C[i][0]+'</span></div>').join(""):'<div style="color:var(--m)">Aucun tirage pour l’instant.</div>'}
function draw(){let i;do{i=Math.floor(Math.random()*C.length)}while(C.length>1&&i===last);current=last=i;H.unshift(i);H=H.slice(0,5);show(C[i]);rh();replay.disabled=false;if(navigator.vibrate)navigator.vibrate(25)}
document.getElementById("draw").onclick=draw;replay.onclick=()=>current!==null&&show(C[current]);document.getElementById("clear").onclick=()=>{H=[];rh()};
</script></body></html>

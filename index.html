<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Défi sportif</title>
<style>
:root{--blue:#2563eb;--blue2:#1d4ed8;--text:#111827}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.app{width:min(100%,680px)}
.card{min-height:420px;border-radius:30px;padding:28px;color:#fff;background:linear-gradient(145deg,var(--blue),var(--blue2));box-shadow:0 24px 60px rgba(37,99,235,.22);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.card:before,.card:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.18);border-radius:50%}
.card:before{width:220px;height:220px;right:-90px;top:-100px}
.card:after{width:120px;height:120px;left:-55px;bottom:-50px}
.label{position:relative;z-index:1;font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#bfdbfe}
.challenge{position:relative;z-index:1;font-size:clamp(38px,9vw,64px);line-height:.95;letter-spacing:-.05em;font-weight:900;margin:10px 0 28px}
.explain{position:relative;z-index:1;border-top:1px solid rgba(255,255,255,.26);padding-top:18px}
.explain strong{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#bfdbfe;margin-bottom:8px}
.explain p{margin:0;color:#f8fbff;font-size:17px;line-height:1.55}
button{width:100%;margin-top:16px;border:0;border-radius:18px;background:var(--blue);color:#fff;font-size:18px;font-weight:900;padding:19px 20px;cursor:pointer;box-shadow:0 12px 32px rgba(37,99,235,.18)}
button:active{transform:scale(.985)}
.flash{animation:flash .24s ease}
@keyframes flash{0%{transform:scale(.975);opacity:.65}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<main class="app">
  <section class="card" id="card">
    <div class="label">Défi</div>
    <div class="challenge" id="challenge">Toute l’équipe fait 10 squats</div>
    <div class="explain">
      <strong>Comment faire</strong>
      <p id="explanation">Debout, pieds écartés à peu près comme les épaules. Descendez comme pour vous asseoir sur une chaise, puis remontez. Chaque joueur en fait 10.</p>
    </div>
  </section>
  <button id="next">CHANGER DE DÉFI</button>
</main>

<script>
const exercises = [
  {name:"squats", singular:"squat", counts:[5,8,10,12,15,20], explain:n=>`Debout, pieds écartés à peu près comme les épaules. Descendez comme pour vous asseoir sur une chaise, puis remontez. Chaque joueur en fait ${n}.`},
  {name:"petits sauts", singular:"petit saut", counts:[10,15,20,25,30], explain:n=>`Restez sur place et faites de petits sauts légers. Chaque joueur en fait ${n}.`},
  {name:"montées de genoux", singular:"montée de genou", counts:[10,15,20,25,30], explain:n=>`Debout, levez un genou puis l’autre, comme si vous marchiez sur place en montant les genoux. Chaque joueur fait ${n} répétitions au total.`},
  {name:"talons-fesses", singular:"talon-fesse", counts:[10,15,20,25,30], explain:n=>`Debout, ramenez alternativement un talon vers la fesse opposée. Chaque joueur fait ${n} répétitions au total.`},
  {name:"levers de bras", singular:"lever de bras", counts:[10,15,20,25], explain:n=>`Bras le long du corps, levez les deux bras au-dessus de la tête puis redescendez. Chaque joueur le fait ${n} fois.`},
  {name:"pas latéraux", singular:"pas latéral", counts:[10,15,20,25], explain:n=>`Faites de petits pas de côté, à droite puis à gauche, sans courir. Chaque joueur fait ${n} pas au total.`},
  {name:"touches d’épaules", singular:"touche d’épaule", counts:[10,15,20,25,30], explain:n=>`Touchez l’épaule gauche avec la main droite, puis l’épaule droite avec la main gauche. Chaque joueur fait ${n} touches au total.`},
  {name:"équilibres", singular:"équilibre", counts:[5,10,15,20], explain:n=>`Levez un pied et tenez ${n} secondes sans le reposer. Chaque joueur tente le défi une fois.`, time:true},
  {name:"chaise contre le mur", singular:"chaise contre le mur", counts:[10,15,20,25,30], explain:n=>`Dos contre un mur, descendez comme si vous étiez assis sur une chaise invisible et tenez ${n} secondes. Chaque joueur tente une fois.`, time:true},
  {name:"bras devant", singular:"bras devant", counts:[10,15,20,25,30], explain:n=>`Tendez les deux bras devant vous à hauteur des épaules et gardez-les ainsi pendant ${n} secondes. Chaque joueur tente une fois.`, time:true},
  {name:"bras sur les côtés", singular:"bras sur les côtés", counts:[10,15,20,25,30], explain:n=>`Tendez les bras à gauche et à droite à hauteur des épaules et gardez-les ainsi pendant ${n} secondes. Chaque joueur tente une fois.`, time:true},
  {name:"bras en l’air", singular:"bras en l’air", counts:[10,15,20,25,30], explain:n=>`Levez les deux bras au-dessus de la tête et gardez-les tendus pendant ${n} secondes. Chaque joueur tente une fois.`, time:true}
];

let lastKey="";
const card=document.getElementById("card");
const challenge=document.getElementById("challenge");
const explanation=document.getElementById("explanation");

function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

function nextChallenge(){
  let ex,n,key;
  do{
    ex=pick(exercises);
    n=pick(ex.counts);
    key=ex.name+"-"+n;
  }while(key===lastKey);
  lastKey=key;

  if(ex.time){
    challenge.textContent=`Tenir ${n} secondes : ${ex.name}`;
  }else{
    challenge.textContent=`Toute l’équipe fait ${n} ${ex.name}`;
  }
  explanation.textContent=ex.explain(n);

  card.classList.remove("flash");
  void card.offsetWidth;
  card.classList.add("flash");
  if(navigator.vibrate) navigator.vibrate(20);
}

document.getElementById("next").addEventListener("click",nextChallenge);
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Défi sportif</title>
<style>
:root{--blue:#2563eb;--blue2:#1d4ed8;--text:#111827}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.app{width:min(100%,680px)}
.card{min-height:420px;border-radius:30px;padding:28px;color:#fff;background:linear-gradient(145deg,var(--blue),var(--blue2));box-shadow:0 24px 60px rgba(37,99,235,.22);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.card:before,.card:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.18);border-radius:50%}
.card:before{width:220px;height:220px;right:-90px;top:-100px}
.card:after{width:120px;height:120px;left:-55px;bottom:-50px}
.label{position:relative;z-index:1;font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#bfdbfe}
.challenge{position:relative;z-index:1;font-size:clamp(38px,9vw,64px);line-height:.95;letter-spacing:-.05em;font-weight:900;margin:10px 0 28px}
.explain{position:relative;z-index:1;border-top:1px solid rgba(255,255,255,.26);padding-top:18px}
.explain strong{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#bfdbfe;margin-bottom:8px}
.explain p{margin:0;color:#f8fbff;font-size:17px;line-height:1.55}
.controls{display:grid;grid-template-columns:1fr 118px;gap:12px;align-items:stretch;margin-top:16px}
button{width:100%;border:0;border-radius:18px;background:var(--blue);color:#fff;font-size:18px;font-weight:900;padding:19px 20px;cursor:pointer;box-shadow:0 12px 32px rgba(37,99,235,.18)}
button:active{transform:scale(.985)}
.timer{border:2px solid #dbeafe;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:var(--blue);background:#eff6ff;cursor:pointer;user-select:none}.timer.hidden{display:none}
.timer.inactive{color:#94a3b8;background:#f8fafc;border-color:#e5e7eb}
.timer.done{background:#dbeafe;color:#1d4ed8}
@media(max-width:430px){.controls{grid-template-columns:1fr 104px}.timer{font-size:24px}}
.flash{animation:flash .24s ease}
@keyframes flash{0%{transform:scale(.975);opacity:.65}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<main class="app">
  <section class="card" id="card">
    <div class="label">Défi</div>
    <div class="challenge" id="challenge">Toute l’équipe fait 10 squats</div>
    <div class="explain">
      <strong>Comment faire</strong>
      <p id="explanation">Debout, pieds écartés à peu près comme les épaules. Descendez comme pour vous asseoir sur une chaise, puis remontez. Chaque joueur en fait 10.</p>
    </div>
  </section>
  <div class="controls">
    <button id="next">CHANGER DE DÉFI</button>
    <div class="timer hidden" id="timer" title="Cliquer pour lancer ou mettre en pause">—</div>
  </div>
</main>

<script>
const exercises = [
  {name:"squats", counts:[15,20,25,30], explain:n=>`Debout, pieds écartés à peu près comme les épaules. Descendez les fesses vers l’arrière puis remontez. Chaque joueur en fait ${n}.`},
  {name:"pompes", counts:[5,8,10,12,15], explain:n=>`Placez les mains au sol, corps bien droit. Descendez la poitrine vers le sol puis poussez pour remonter. Chaque joueur en fait ${n}.`},
  {name:"burpees", counts:[5,6,8,10,12], explain:n=>`Depuis la position debout, posez les mains au sol, envoyez les pieds derrière, ramenez-les puis relevez-vous avec un petit saut. Chaque joueur en fait ${n}.`},
  {name:"squats avec saut", counts:[8,10,12,15,20], explain:n=>`Faites un squat puis sautez en remontant. Atterrissez doucement avant de recommencer. Chaque joueur en fait ${n}.`},
  {name:"fentes", counts:[10,12,16,20,24], explain:n=>`Faites un grand pas en avant, pliez les deux jambes puis revenez debout. Alternez jambe droite et jambe gauche. Chaque joueur fait ${n} répétitions au total.`},
  {name:"montées de genoux rapides", counts:[30,40,50,60], explain:n=>`Courez sur place en montant les genoux assez haut. Comptez chaque montée de genou. Chaque joueur en fait ${n}.`},
  {name:"talons-fesses rapides", counts:[30,40,50,60], explain:n=>`Courez sur place en ramenant alternativement les talons vers les fesses. Chaque joueur fait ${n} répétitions.`},
  {name:"sauts pieds joints", counts:[20,25,30,40], explain:n=>`Gardez les pieds joints et faites de petits sauts rapides sur place. Chaque joueur en fait ${n}.`},
  {name:"sauts écartés", counts:[20,25,30,40], explain:n=>`Sautez en écartant les jambes et en levant les bras, puis revenez pieds joints. Chaque joueur en fait ${n}.`},
  {name:"montées sur la pointe des pieds", counts:[20,25,30,40], explain:n=>`Debout, montez sur la pointe des pieds puis redescendez lentement. Chaque joueur en fait ${n}.`},
  {name:"genoux alternés en position de pompe", counts:[20,30,40,50], explain:n=>`Mettez-vous en position de pompe, bras tendus. Ramenez rapidement un genou vers la poitrine puis l’autre. Comptez chaque genou. Chaque joueur en fait ${n}.`},
  {name:"pompes puis squats", counts:[5,8,10], explain:n=>`Chaque joueur fait ${n} pompes, se relève, puis fait immédiatement ${n*2} squats.`},
  {name:"burpees puis squats", counts:[5,6,8], explain:n=>`Chaque joueur fait ${n} burpees puis enchaîne immédiatement avec ${n*2} squats.`},
  {name:"squats puis sauts", counts:[15,20,25], explain:n=>`Chaque joueur fait ${n} squats puis ${Math.round(n/2)} sauts pieds joints sans longue pause.`},
  {name:"chaise contre le mur", counts:[30,40,45,60], explain:n=>`Dos contre un mur, descendez comme si vous étiez assis sur une chaise invisible et tenez ${n} secondes. Chaque joueur tente une fois.`, time:true},
  {name:"bras tendus sur les côtés", counts:[30,40,45,60], explain:n=>`Tendez les bras à gauche et à droite à hauteur des épaules et gardez-les immobiles pendant ${n} secondes.`, time:true},
  {name:"équilibre sur un pied", counts:[20,30,40,45], explain:n=>`Levez un pied et tenez ${n} secondes sans le reposer. Après la moitié du temps, mettez les mains sur la tête.`, time:true},
  {name:"squats sans arrêt", counts:[30,40,45,60], explain:n=>`Faites des squats continuellement pendant ${n} secondes, à votre rythme, sans vous arrêter.`, time:true},
  {name:"montées de genoux sans arrêt", counts:[30,40,45,60], explain:n=>`Courez sur place en montant les genoux pendant ${n} secondes sans vous arrêter.`, time:true},
  {name:"sauts écartés sans arrêt", counts:[30,40,45,60], explain:n=>`Enchaînez les sauts écartés pendant ${n} secondes sans pause.`, time:true}
]

let lastKey="";
let timerSeconds=null;
let timerLeft=null;
let timerInterval=null;
const card=document.getElementById("card");
const challenge=document.getElementById("challenge");
const explanation=document.getElementById("explanation");
const timer=document.getElementById("timer");

function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

function resetTimer(seconds){
  clearInterval(timerInterval);
  timerInterval=null;
  timerSeconds=seconds;
  timerLeft=seconds;
  if(seconds===null){
    timer.textContent="—";
    timer.className="timer hidden";
  }else{
    timer.textContent=seconds+"s";
    timer.className="timer";
  }
}

function toggleTimer(){
  if(timerSeconds===null) return;
  if(timerInterval){
    clearInterval(timerInterval);
    timerInterval=null;
    return;
  }
  if(timerLeft<=0) timerLeft=timerSeconds;
  timer.className="timer";
  timerInterval=setInterval(()=>{
    timerLeft--;
    timer.textContent=timerLeft+"s";
    if(timerLeft<=0){
      clearInterval(timerInterval);
      timerInterval=null;
      timer.className="timer done";
      if(navigator.vibrate) navigator.vibrate([100,80,100]);
    }
  },1000);
}

function nextChallenge(){
  let ex,n,key;
  do{
    ex=pick(exercises);
    n=pick(ex.counts);
    key=ex.name+"-"+n;
  }while(key===lastKey);
  lastKey=key;

  if(ex.time){
    challenge.textContent=`Tenir ${n} secondes : ${ex.name}`;
  }else{
    challenge.textContent=`Toute l’équipe fait ${n} ${ex.name}`;
  }
  explanation.textContent=ex.explain(n);
  resetTimer(ex.time ? n : null);

  card.classList.remove("flash");
  void card.offsetWidth;
  card.classList.add("flash");
  if(navigator.vibrate) navigator.vibrate(20);
}

document.getElementById("next").addEventListener("click",nextChallenge);
timer.addEventListener("click",toggleTimer);
</script>
</body>
</html>
